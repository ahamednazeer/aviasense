services:
  db:
    image: postgres:16-alpine
    container_name: aviasense-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aviasense}
      POSTGRES_USER: ${POSTGRES_USER:-aviasense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aviasense}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aviasense} -d ${POSTGRES_DB:-aviasense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aviasense-backend
    env_file:
      - .env
    environment:
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-dev-key-please-change}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aviasense}:${POSTGRES_PASSWORD:-aviasense}@db:5432/${POSTGRES_DB:-aviasense}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
